<!-- MD5 -->
<script src="/js/md5.js"></script>
<script src="/js/xhr.js"></script>
<script src="/js/lock.js"></script>

<script>
	float_window.create()

	// 注册提交
	async function register() {
		
		// 注册信息提取
		const uname = document.querySelector('#reg_uname').value
		const psw = md5(document.querySelector('#reg_psw').value)
		float_window.title("提示")

		// 有信息未填
		if (uname == "" || psw == "") {
			float_window.content("请填入用户名和密码！缺一不可！")
			float_window.open()
			return
		}

		// 请求锁，防止过量请求
		if (lock()) {
			return
		}

		var data = {
			uname: uname,
			psw: psw
		}

		fetch_API("POST", `${API}/user/register`, {}, data).then(res => {

			// 注册不成功
			if (res['error']) {
				float_window.content(`${res['error']}`)
				
			} else {
				float_window.content(`注册成功！需要您自行输入用户名和密码登录呢！`)
				
			}
		}).catch(err => { float_window.content(`${err.message}`) })
		float_window.open()
	}




	// 登录提交
	const login = () => {

		// 获取登录信息
		const uname = document.querySelector('#login_uname').value
		const psw = md5(document.querySelector('#login_psw').value)
		float_window.title("提示")

		// 信息未填完全
		if (uname == "" || psw == "d41d8cd98f00b204e9800998ecf8427e") {
			float_window.content("请填入用户名和密码！缺一不可！")
			float_window.open()
			return
		}

		var data = {
			uname: uname,
			psw: psw
		}

		fetch_API("POST", `${API}/user/login`, {}, data).then(res => {
			// 登录不成功
			if (res['error']) {
				float_window.content(`${res['error']}`)

			} else {
				set_cookie("sessionID", res['data']['sessionID'])
				set_cookie("uid", res['data']['uid'])
				set_cookie("uname", res['data']['user']['uname'])
				set_cookie("avatar_small", res['data']['user']['avatar_small'])
				float_window.content(`登录成功！系统马上自动跳转！`)
				window.location.href = `/user_admin`
			}
		}).catch(err => { float_window.content(`${err.message}`) })
		float_window.open()
	}
</script>
