<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta name='description' content='GALBase论坛 - Galgame资源站点'>
	<title>搜索结果</title>
	<!-- css -->
	<link rel="stylesheet" href="/css/header.css">
	<link rel="stylesheet" href="/css/style.css">

	<style>
		.msgs li {
			text-align: left;
			overflow: auto;
		}

		.none_read {
			background-color: #D6790E;
		}

		* {
			margin: 0;
			padding: 0;
		}

		.else {
			width: 90%;
			margin-left: 5%;
		}

		#search_state {
			text-align: center;
		}

		h2 {
			color: #333;
		}
	</style>

</head>
<body>
	<script src="/js/functions.js"></script>

	<div class="header"></div>
	<script src="/js/header.js"></script>

	<br>
	<br>

	<div class="board main_board else">
		<img src="/data/imgs/title_arc.png" class="title_arc">
		<div class="board_2nd">
			<header>
				<img src="/data/imgs/title_start.png" class="title_start">
				<ul class="title_content">
					<li>搜</li>
					<li>索</li>
				</ul>
				<img src="/data/imgs/title_end.png" class="title_end">

				<div class="buttons_">
					<h2 id="search_state">搜索尽量别带有符号</h2>

					<select id="type" style="padding: 0 20px 0 20px">
						<option value="title">标题搜索</option>
						<option value="normal">全文搜索</option>
						<option value="tag">TAG搜索</option>
						<option value="developer">会社搜索</option>
					</select>

					<input id="search_content" type="text" placeholder="搜索内容" style="width: 400px"><span onclick="search()"></span>
					<button onclick="search_full()">执行搜索</button>
					<button onclick="GUI_search_guide()">TAG搜索指南</button>
				</div>
			</header>
			<main>
				<ul class="msgs"></ul>
			</main>
		</div>
	</div>
</body>



<script src="/js/search.js"></script>
<script src="/js/footer.js"></script>
