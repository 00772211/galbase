<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<title>账号管理</title>
	<!-- css -->
	<link rel="stylesheet" href="/css/header.css">
	<link rel="stylesheet" href="/css/style.css">

	<style>
		/* 清除内外边距 */
		* {
			margin: 0;
			padding: 0;
		}
		
		.else main {
			position: relative;
		}

		input {
			width: 30%;
		}

		.avatar_big {
			position: absolute;
			height: 94%;
			right: 0;
			border: white 6px solid;
			border-radius: 15%;
			transition: border 0.75s, border-radius 0.75s;
			box-sizing: border-box;
			cursor: pointer;
		}

		.avatar_big:hover {
			border: #EEEEEE 4px solid;
			border-radius: 0;
		}

		#uploadBox {
			display: flex;
			align-items: center;
			justify-content: center;
			margin-left: 50%;
			width: 100px;
			height: 30px;
			border: 3px dashed #ccc;
			cursor: pointer;
			transform: translate(-50%);
		}

		#uploadBox:hover {
			border-color: #aaa;
		}

		#uploadBox input[type="file"] {
			display: none;
		}

		#previewContainer {
			display: flex;
			align-items: center;
			justify-content: center;
			margin-top: 20px;
		}

		#previewWrapper {
			position: relative;
			width: 100%;
			height: auto;
			max-height: 100%;
			overflow: hidden;
		}

		#preview {
			width: 100%;
			max-height: 100%;
			object-fit: contain;
		}

		#selectionBox {
			position: absolute;
			top: -1%;
			left: -1%;
			/* height: 2vw; */
			border: 2px dashed #f00;
		}

		#resizeHandle {
			position: absolute;
			bottom: 0;
			right: 0;
			width: 10px;
			height: 10px;
			background-color: #f00;
			cursor: se-resize;
		}

		#downloadButton {
			margin-top: 20px;
		}
	</style>
</head>
<body>
	<script src="/js/functions.js"></script>

	<br>

	<div class="board navigation_bar"></div>

				正在推进的故事：<input type="text" id="playing_story" placeholder="友情是不张扬，不自夸。" value=""><br><br>
				强烈推荐的故事：<input type="text" id="recommend_stories" placeholder="格式：A|B|C|D|E" value=""><br><br>
				<button onclick="user_data_update()">全部信息提交</button>
